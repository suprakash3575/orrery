# A small copy of stage1.toml for a laptop: bot games, a probe diagnosis and
# the analysis, on 2 maps and the CPU, in under a minute, to check the session
# works before Vast.ai:
#
#   make exp-smoke
#
# It has no training job: the rl-v2 contract makes every update full size
# (512 games x 64 turns), far too slow for a laptop CPU. stage1-smoke-gpu.toml
# adds training and runs first on the Vast.ai machine.
#
# Its numbers mean nothing; only that every job finishes and the analysis
# reads them.

[session]
name = "stage1-smoke"
maps = { start = 1000000, count = 2 }
device = "cpu"
cpu_workers = 4
gomaxprocs = 4

[[botcheck]]
name = "restricted-bot"
opponent = "heuristic-v2:candidates=4,enemy_bonus=1,margin=0.1"
check_decode = ["all-three-capture"]

[botcheck.testers]
normal = "heuristic-v2:candidates=4,enemy_bonus=1,margin=0.1"
all-three-capture = "heuristic-v2:candidates=4,enemy_bonus=1,garrison_cost=needed,learner_aim=1,margin=0.1,no_aim_check=1,whole_garrison=1"

[[botcheck]]
name = "epsilon-scale"
opponent = "heuristic-v2:candidates=4,enemy_bonus=1,margin=0.1"

[botcheck.testers]
"eps-0.5" = "heuristic-v2:candidates=4,enemy_bonus=1,epsilon=0.5,margin=0.1"

[[diagnose]]
name = "probe"
run_dirs = ["runs/vast-experiment/exp-b-4p-s1501"]
updates = [153]
band = [0.10, 0.40]
band_min_runs = 1

[diagnose.opponents]
"v2-eps0.5" = "heuristic-v2:candidates=4,enemy_bonus=1,epsilon=0.5,margin=0.1"

[[compare]]
question = "How much strength does the fully limited bot keep?"
baseline = "restricted-bot/normal"
candidate = "restricted-bot/all-three-capture"
rule = "restricted-bot"

[[dial]]
name = "epsilon"
order = ["restricted-bot/normal", "epsilon-scale/eps-0.5"]
