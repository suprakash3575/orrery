[project]
name = "orrery-rl"
version = "0.1.0"
description = "Python reinforcement-learning client for the Orrery environment"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    # PyTorch 2.14's default Linux wheel uses CUDA 13.0. uv.lock records the
    # exact Torch and NVIDIA runtime packages so every Linux install repeats
    # the same training stack instead of silently moving to a newer release.
    "torch==2.14.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # PyTorch stopped publishing Intel macOS wheels after this release. Keep
    # local CPU development installable while the Linux cloud run uses 2.14.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
# Charts for local analysis scripts. Not installed by default, so training
# machines stay lean; run `uv run --group analysis ...` or
# `uv sync --group analysis` to include it.
analysis = [
    "matplotlib>=3.8,<4",
]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = ["-m", "not acceptance"]
markers = [
    "acceptance: long-running baseline checks run explicitly before push",
]
pythonpath = ["."]
testpaths = ["tests"]
